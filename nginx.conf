server {
    listen 80;
    server_name sintegra-additive.ru www.sintegra-additive.ru;
    root /usr/share/nginx/html;
    index index.html;

    # Кеширование статики с no-transform (запрет на контент-трансформации)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # HTML-страницы: короткое кеширование с ревалидацией
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Проксирование API на Flask-бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback и статика
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сжатие: gzip + brotli (если модуль установлен)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    brotli on;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
    brotli_min_length 1000;
    brotli_comp_level 5;
}
