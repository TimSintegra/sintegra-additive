server {
    listen 80;
    server_name sintegra-additive.ru www.sintegra-additive.ru;
    root /usr/share/nginx/html;
    index index.html;

    # Кеширование статических ресурсов (изображения, шрифты, медиа)
    location ~* \.(png|webp|jpg|jpeg|gif|ico|svg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # Кеширование статических ресурсов (CSS, JS, шрифты)
    location ~* \.(css|js|woff|woff2|ttf|eot|otf|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # HTML-страницы: короткое кеширование с ревалидацией
    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Проксирование API на Flask-бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback и статика
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;
}
